<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve Payment</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #0a0e17;
        --card: #131921;
        --card-border: #1e2a3a;
        --text: #e8edf3;
        --muted: #7a8a9e;
        --accent: #00d4aa;
        --accent-glow: rgba(0, 212, 170, 0.15);
        --accent-hover: #00e8bc;
        --danger: #ff4757;
        --danger-bg: rgba(255, 71, 87, 0.1);
        --danger-border: rgba(255, 71, 87, 0.25);
        --success: #00d4aa;
        --success-bg: rgba(0, 212, 170, 0.1);
        --field-bg: #0d1219;
        --field-border: #1a2332;
        --radius: 16px;
        --radius-sm: 12px;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        color: var(--text);
        background: var(--bg);
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 20px;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        width: 100%;
        max-width: 440px;
        margin-top: 10vh;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 24px;
      }

      .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent), #0088ff);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
        font-size: 28px;
        box-shadow: 0 8px 32px rgba(0, 212, 170, 0.2);
      }

      .header h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.3px;
        margin-bottom: 6px;
      }

      .header p {
        font-size: 14px;
        color: var(--muted);
        line-height: 1.5;
      }

      /* Card */
      .card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: var(--radius);
        overflow: hidden;
      }

      /* Amount hero section */
      .amount-hero {
        padding: 28px 24px;
        text-align: center;
        border-bottom: 1px solid var(--card-border);
        background: linear-gradient(180deg, rgba(0, 212, 170, 0.04) 0%, transparent 100%);
      }

      .amount-label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--muted);
        margin-bottom: 8px;
      }

      .amount-value {
        font-size: 44px;
        font-weight: 700;
        letter-spacing: -1.5px;
        color: var(--text);
        line-height: 1.1;
      }

      .amount-value .currency {
        font-size: 20px;
        font-weight: 500;
        color: var(--muted);
        margin-left: 6px;
        vertical-align: middle;
      }

      .item-name {
        margin-top: 10px;
        font-size: 15px;
        color: var(--accent);
        font-weight: 500;
      }

      .merchant-name {
        margin-top: 4px;
        font-size: 13px;
        color: var(--muted);
      }

      /* Details grid */
      .details {
        padding: 20px 24px;
      }

      .detail-row {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        padding: 12px 0;
        border-bottom: 1px solid var(--field-border);
      }

      .detail-row:last-child {
        border-bottom: none;
      }

      .detail-label {
        font-size: 13px;
        color: var(--muted);
        font-weight: 500;
        flex-shrink: 0;
        margin-right: 16px;
      }

      .detail-value {
        font-size: 13px;
        font-weight: 500;
        text-align: right;
        word-break: break-all;
        font-family: 'SF Mono', 'Fira Code', monospace;
        color: var(--text);
        max-width: 260px;
      }

      .detail-value.truncated {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* Countdown */
      .countdown-bar {
        padding: 12px 24px;
        background: var(--field-bg);
        border-top: 1px solid var(--field-border);
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      .countdown-bar .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 2s ease-in-out infinite;
      }

      .countdown-bar.warning .dot {
        background: #ffaa00;
      }

      .countdown-bar.expired .dot {
        background: var(--danger);
        animation: none;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      /* Actions */
      .actions {
        padding: 20px 24px 24px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .btn {
        border: none;
        border-radius: var(--radius-sm);
        padding: 16px 24px;
        font-size: 16px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .btn:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .btn-approve {
        background: var(--accent);
        color: #0a0e17;
        box-shadow: 0 4px 24px rgba(0, 212, 170, 0.3);
      }

      .btn-approve:hover:not(:disabled) {
        background: var(--accent-hover);
        box-shadow: 0 6px 32px rgba(0, 212, 170, 0.4);
        transform: translateY(-1px);
      }

      .btn-approve:active:not(:disabled) {
        transform: translateY(0);
      }

      .btn-reject {
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid var(--danger-border);
      }

      .btn-reject:hover:not(:disabled) {
        background: rgba(255, 71, 87, 0.15);
      }

      .btn-icon {
        font-size: 20px;
        line-height: 1;
      }

      /* Status */
      .status-bar {
        margin-top: 16px;
        text-align: center;
      }

      .status-msg {
        font-size: 14px;
        font-weight: 500;
        padding: 12px 20px;
        border-radius: var(--radius-sm);
        display: inline-block;
      }

      .status-msg.error {
        background: var(--danger-bg);
        color: var(--danger);
        border: 1px solid var(--danger-border);
      }

      .status-msg.success {
        background: var(--success-bg);
        color: var(--success);
        border: 1px solid rgba(0, 212, 170, 0.25);
      }

      .status-msg.info {
        background: rgba(0, 136, 255, 0.1);
        color: #4da6ff;
        border: 1px solid rgba(0, 136, 255, 0.2);
      }

      /* Loading skeleton */
      .skeleton {
        background: linear-gradient(90deg, var(--field-bg) 25%, #1a2332 50%, var(--field-bg) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 8px;
        height: 20px;
      }

      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }

      /* Security badge */
      .security-badge {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        opacity: 0.7;
      }

      /* State: loading */
      .state-loading .amount-value { display: none; }
      .state-loading .amount-hero .skeleton { height: 44px; width: 200px; margin: 0 auto; }

      /* Mobile tweaks */
      @media (max-width: 480px) {
        .container { margin-top: 4vh; }
        .amount-value { font-size: 36px; }
        .detail-value { max-width: 180px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">🛡️</div>
        <h1>Payment Approval</h1>
        <p>Verify the details below, then approve with your passkey.</p>
      </div>

      <div class="card">
        <div class="amount-hero" id="amount-hero">
          <div class="amount-label">Total Amount</div>
          <div class="amount-value" id="amount-display">—</div>
          <div class="item-name" id="item-name"></div>
          <div class="merchant-name" id="merchant-name"></div>
        </div>

        <div class="details" id="details">
          <div class="detail-row">
            <span class="detail-label">Recipient</span>
            <span class="detail-value truncated" id="detail-to">—</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Token</span>
            <span class="detail-value truncated" id="detail-token">—</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Memo</span>
            <span class="detail-value" id="detail-memo">—</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Intent ID</span>
            <span class="detail-value truncated" id="detail-intent">—</span>
          </div>
        </div>

        <div class="countdown-bar" id="countdown-bar">
          <span class="dot"></span>
          <span id="countdown">Loading...</span>
        </div>

        <div class="actions" id="actions">
          <button id="approve-btn" class="btn btn-approve" disabled>
            <span class="btn-icon">🔐</span>
            Approve with Passkey
          </button>
          <button id="reject-btn" class="btn btn-reject" disabled>
            Reject
          </button>
        </div>
      </div>

      <div class="status-bar">
        <div id="status" class="status-msg" style="display:none;"></div>
      </div>

      <div class="security-badge">
        🔒 Secured by on-chain signature verification
      </div>
    </div>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
