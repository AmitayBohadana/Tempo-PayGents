<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Approve Payment Intent</title>
    <style>
      :root {
        --bg: #f6f7f8;
        --card: #ffffff;
        --text: #1b1d1f;
        --muted: #5b6166;
        --border: #e4e7eb;
        --primary: #0f766e;
        --danger: #b91c1c;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top, #e8f5f3 0%, var(--bg) 40%);
        min-height: 100vh;
      }

      .layout {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(10, 12, 14, 0.05);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .intent-grid {
        margin-top: 18px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .field {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px;
      }

      .label {
        font-size: 12px;
        color: var(--muted);
      }

      .value {
        margin-top: 4px;
        font-size: 14px;
        word-break: break-all;
      }

      .actions {
        margin-top: 18px;
        display: flex;
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14px;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .approve {
        background: var(--primary);
        color: #ffffff;
      }

      .reject {
        background: #fee2e2;
        color: var(--danger);
      }

      .status {
        margin-top: 16px;
        font-size: 14px;
        font-weight: 500;
      }

      .countdown {
        margin-top: 14px;
        font-size: 13px;
        color: var(--muted);
      }

      @media (max-width: 700px) {
        .intent-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <div class="card">
        <h1>Review Payment Intent</h1>
        <p>Approve only if these details match your request.</p>

        <div id="intent-grid" class="intent-grid"></div>

        <div class="countdown" id="countdown"></div>

        <div class="actions">
          <button id="approve-btn" class="approve">Approve With Passkey (Demo)</button>
          <button id="reject-btn" class="reject">Reject</button>
        </div>

        <div id="status" class="status"></div>
      </div>
    </div>

    <script type="module" src="/assets/app.js"></script>
  </body>
</html>
